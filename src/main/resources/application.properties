spring.application.name=ecommercespring

server.port=${PORT:3000}

spring.datasource.url=jdbc:mysql://localhost:3306/ecommercedb
spring.datasource.username=root
spring.datasource.password=Ch!n!2608


#This tells springboot which JDBCD driver class to use
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#tells hibernate to print all the generated sql queries to the console. Useful for debugging or learning
spring.jpa.show-sql=true

#specifies the sql dialect hibernate to use: ensures hibernate geneartes SQL optimised syntax. Without this, 
#springboot might guess based on jdbc url
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


#controls how hibernate handles schema generation
#none> no change to DB schema
#create> Drops and recreate schema in every run
#create-drop> Drop schema at the app stops
#update> updates DB schema(Add new cols/tables, won't delete)

spring.jpa.hibernate.ddl-auto=update
